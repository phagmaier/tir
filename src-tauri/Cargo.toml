[package]
name = "tir"
version = "0.1.0"
description = "A desktop screenwriting application"
edition = "2024"
publish = false

[lib]
name = "tir_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# The system's file and message dialogs, shown from Rust only (task 1.9).
tauri-plugin-dialog = "2.8"
# Commands' results as JSON objects; already in the build through Tauri.
serde = { version = "1", features = ["derive"] }
# Reads the library's folder from the settings file; already in the build
# through Tauri.
serde_json = "1"
# Decodes an exported PDF's suggested name from its request header (task
# 3.1); already in the build through Tauri.
percent-encoding = "2"
