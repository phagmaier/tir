<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: how dark should the page be in the dark
  theme? The user chose Ink & Brass (piece 2) and wants dark paper in dark
  mode instead of glaring white. Three tones, switched with
  ?paper=night|dusk|lamplight, the arrows in the yellow bar, or the left
  and right arrow keys. The light theme keeps white paper.

    night      the page barely lifts from the background; dimmest
    dusk       a clearer sheet, cool blue-grey, ivory text
    lamplight  a warm brown-black sheet with parchment text

  Find highlights, the spelling squiggle, autocomplete's ghost text and the
  caret are recoloured for dark paper. PDFs stay black on white.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tir prototype: dark paper</title>
<link rel="stylesheet" href="page.css">
<style>
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-Variable.ttf") format("truetype"); font-weight: 100 700; font-stretch: 85% 100%; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Regular.ttf") format("truetype"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Medium.ttf") format("truetype"); font-weight: 500; }
@font-face { font-family: "Figtree"; src: url("fonts/Figtree-Variable.ttf") format("truetype"); font-weight: 300 900; }
@font-face { font-family: "Newsreader"; src: url("fonts/Newsreader-Variable.ttf") format("truetype"); font-weight: 200 800; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui-font); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
ol, ul { list-style: none; margin: 0; padding: 0; }

#app { position: fixed; inset: 0; }
#topbar, #sidebar { position: absolute; z-index: 10; transition: opacity 0.45s ease, transform 0.3s ease; }
#canvas { position: absolute; inset: 0; overflow: auto; scroll-padding: 120px; }
#pages { display: flex; flex-direction: column; align-items: center; gap: var(--gap, 28px); width: fit-content; min-width: 100%; margin: 0 auto; }
.sheet { box-shadow: var(--sheet-shadow); border-radius: var(--sheet-radius, 0); }
body.focus #topbar, body.focus #sidebar { opacity: 0; pointer-events: none; }
.warn { color: var(--warn); }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Shared popovers, each variant styles them through the variables. */
.pop { position: fixed; z-index: 40; background: var(--pop-bg); color: var(--pop-fg); border: 1px solid var(--pop-border); border-radius: var(--pop-radius); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32); }
.pop[hidden], #findbar[hidden], #draftmenu[hidden] { display: none; }
#draftmenu { width: 300px; padding: 6px; }
#draftmenu .dm-h { padding: 8px 10px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#draftmenu .dm-d { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: calc(var(--pop-radius) - 3px); text-align: left; }
#draftmenu .dm-d:hover, #draftmenu .dm-a:hover { background: var(--hover); }
#draftmenu .dm-d small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
#draftmenu .dm-d .ck { color: var(--accent); }
#draftmenu hr { border: 0; border-top: 1px solid var(--pop-border); margin: 6px 4px; }
#draftmenu .dm-a { display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border-radius: calc(var(--pop-radius) - 3px); text-align: left; }
#draftmenu .dm-a small { color: var(--muted); }
#draftmenu .dm-a.danger { color: var(--danger); }
#draftmenu .dm-fork { display: flex; gap: 6px; padding: 6px 6px 4px; }
#draftmenu .dm-fork input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--pop-border); background: var(--field); }
#draftmenu .dm-fork button { padding: 6px 10px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
#draftmenu .dm-note { padding: 2px 10px 8px; font-size: 11.5px; color: var(--muted); }

#findbar { width: 430px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#findbar .fb-row { display: flex; align-items: center; gap: 4px; }
#findbar .fb-ico { width: 26px; display: grid; place-items: center; color: var(--muted); }
#findbar input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--pop-border); background: var(--field); }
#findbar .fb-count { min-width: 52px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#findbar .ib { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
#findbar .ib:hover, #findbar .tb:hover { background: var(--hover); color: var(--pop-fg); }
#findbar .tb { height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-size: 12px; }
#findbar .tb.on { color: var(--accent); background: var(--accent-soft); }
#findbar .rb { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--pop-border); font-size: 12px; }
#findbar .rb:hover { background: var(--hover); }

#toast { position: fixed; z-index: 50; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: var(--pop-bg); color: var(--pop-fg); border: 1px solid var(--pop-border); font-size: 12.5px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
#toast.show { opacity: 1; }

/* ============ Desk, refined; colours come from the palette ============ */
body[data-variant="A"] { --ui-font: "IBM Plex Sans", system-ui, sans-serif; --gap: 30px; --pop-radius: 10px; background: var(--canvas); }
body[data-variant="A"] :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

body[data-palette="brass"][data-theme="dark"] {
  --canvas: #0d1014; --chrome: #141820; --rule: rgba(160, 180, 210, 0.09); --hover: rgba(160, 180, 210, 0.06);
  --fg: #e9e4d8; --muted: #939aa5; --faint: #7d848d;
  --accent: #d4b278; --accent-soft: rgba(212, 178, 120, 0.14); --on-accent: #16120b; --ring: #d4b278;
  --warn: #f08a6e; --danger: #f08a6e; --mark: #f08a6e; --mark-halo: rgba(240, 138, 110, 0.25);
  --paper: #fdfcf8; --sheet-shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 18px 44px rgba(0, 0, 0, 0.5);
  --pop-bg: #1b2029; --pop-fg: #e9e4d8; --pop-border: rgba(160, 180, 210, 0.12); --field: #10141a;
}
body[data-palette="brass"][data-theme="light"] {
  --canvas: #e6e3dc; --chrome: #f8f6f1; --rule: rgba(40, 35, 20, 0.1); --hover: rgba(40, 35, 20, 0.055);
  --fg: #1d2128; --muted: #646b76; --faint: #6d7075;
  --accent: #7e612f; --accent-soft: rgba(143, 110, 53, 0.12); --on-accent: #ffffff; --ring: #7e612f;
  --warn: #ba4d2a; --danger: #c2502c; --mark: #e07a55; --mark-halo: rgba(224, 122, 85, 0.25);
  --paper: #ffffff; --sheet-shadow: 0 1px 2px rgba(40, 30, 10, 0.1), 0 10px 30px rgba(40, 30, 10, 0.1);
  --pop-bg: #fffdf8; --pop-fg: #1d2128; --pop-border: rgba(40, 35, 20, 0.12); --field: #f3f0ea;
}

/* Dark paper, for the dark theme only. */
body[data-palette="brass"][data-theme="dark"] {
  --pop-bg: #222831;
  --ghost: #6f7782; --spell: #f08a6e; --caret: #d4b278;
  --hit: rgba(212, 178, 120, 0.3); --hit-cur: #d4b278; --hit-cur-fg: #16120b; --hit-ring: #d4b278;
  --tip-bg: #252c37; --tip-fg: #e9e4d8; --tip-border: rgba(160, 180, 210, 0.16);
}
body[data-palette="brass"][data-theme="dark"][data-paper="night"] {
  --canvas: #0a0d11; --paper: #141920; --ink: #d6d0c2;
  --sheet-shadow: 0 0 0 1px rgba(160, 180, 210, 0.07), 0 14px 36px rgba(0, 0, 0, 0.55);
}
body[data-palette="brass"][data-theme="dark"][data-paper="dusk"] {
  --canvas: #0d1014; --paper: #1b2029; --ink: #e0dacd;
  --sheet-shadow: 0 0 0 1px rgba(160, 180, 210, 0.08), 0 16px 40px rgba(0, 0, 0, 0.5);
}
body[data-palette="brass"][data-theme="dark"][data-paper="lamplight"] {
  --canvas: #0d1014; --paper: #1f1c17; --ink: #e5dac4; --ghost: #7a7265;
  --sheet-shadow: 0 0 0 1px rgba(212, 178, 120, 0.09), 0 16px 40px rgba(0, 0, 0, 0.5);
}

body[data-variant="A"] #topbar { left: 0; right: 0; top: 0; height: 50px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 12px; background: var(--chrome); border-bottom: 1px solid var(--rule); }
body[data-variant="A"] #sidebar { left: 0; top: 50px; bottom: 0; width: 264px; display: flex; flex-direction: column; background: var(--chrome); border-right: 1px solid var(--rule); }
body[data-variant="A"] #canvas { left: 264px; top: 50px; }
body[data-variant="A"] #pages { padding: 40px 48px 140px; }
body[data-variant="A"].focus #canvas { left: 0; top: 0; }
body[data-variant="A"] #findbar { top: 58px; right: 16px; }
.a-left { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 2px; }
.a-proj { font-family: "Newsreader", Georgia, serif; font-size: 19px; font-weight: 500; letter-spacing: 0.003em; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.a-proj:hover { background: var(--hover); }
.a-slash { color: var(--faint); font-size: 18px; font-weight: 300; margin: 0 2px; }
.a-draft { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
.a-draft:hover { background: var(--hover); color: var(--fg); }
.a-mid { display: flex; gap: 2px; }
.a-mid .elb { height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.a-mid .elb:hover { color: var(--fg); background: var(--hover); }
.a-mid .elb.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
.a-mid .s { display: none; }
@media (max-width: 1560px) { .a-mid .f { display: none; } .a-mid .s { display: inline; } }
.a-right { flex: 1 1 0; display: flex; justify-content: flex-end; align-items: center; gap: 2px; white-space: nowrap; font-size: 12.5px; }
.a-right > * { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; color: var(--muted); }
.a-right > button:hover { background: var(--hover); color: var(--fg); }
.a-right .pg { font-variant-numeric: tabular-nums; }
.a-right > .warn { color: var(--warn); }
.a-right .sep { width: 1px; height: 16px; padding: 0; background: var(--rule); margin: 0 4px; }
.a-head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 18px 10px; font-size: 11px; font-weight: 550; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.a-head span + span { color: var(--faint); font-weight: 450; }
.a-scenes { flex: 1; overflow: auto; padding: 0 8px 8px; }
.a-scenes li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 7px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.a-scenes li:hover { background: var(--hover); color: var(--fg); }
.a-scenes li.on { background: var(--hover); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.a-scenes .no, .a-scenes .pg { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.a-scenes .no { text-align: right; }
.a-scenes li.on .no { color: var(--accent); }
.a-scenes .hd { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; letter-spacing: 0.01em; }
.a-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
.a-foot .z { display: flex; align-items: center; gap: 2px; }
.a-foot .z button { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; }
.a-foot .z button:hover { background: var(--hover); color: var(--fg); }
.a-foot .z span { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

/* ============ Prototype bar: deliberately not part of any design ============ */
#proto { position: fixed; z-index: 1000; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; background: #0b0b0b; border: 1.5px solid #ffd60a; color: #ffd60a; font: 12px/1 ui-monospace, "DejaVu Sans Mono", monospace; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); white-space: nowrap; }
#proto button { padding: 6px 10px; border-radius: 999px; }
#proto button:hover { background: rgba(255, 214, 10, 0.16); }
#proto button.on { background: #ffd60a; color: #0b0b0b; }
#proto .tag { padding: 6px 10px; border-radius: 999px; background: #ffd60a; color: #0b0b0b; font-weight: 700; letter-spacing: 0.06em; }
#proto .vl { min-width: 210px; text-align: center; }
#proto .dv { width: 1px; height: 18px; background: rgba(255, 214, 10, 0.4); margin: 0 4px; }
#keys { position: fixed; z-index: 1000; left: 50%; bottom: 62px; transform: translateX(-50%); padding: 12px 16px; border-radius: 12px; background: #0b0b0b; border: 1.5px solid #ffd60a; color: #ffd60a; font: 12px/1.7 ui-monospace, monospace; }
#keys[hidden] { display: none; }
#keys b { display: inline-block; min-width: 150px; color: #fff; font-weight: 400; }

@media (prefers-reduced-motion: reduce) { #topbar, #sidebar, #toast { transition: none; } .spin { animation: none; } }
</style>
</head>
<body data-variant="A" data-palette="brass" data-paper="dusk" data-theme="dark">
<div id="app">
  <header id="topbar"></header>
  <aside id="sidebar" aria-label="Scenes"></aside>
  <main id="canvas"><div id="pages"></div></main>
</div>

<div id="draftmenu" class="pop" hidden role="menu" aria-label="Drafts"></div>

<div id="findbar" class="pop" hidden role="search" aria-label="Find and replace">
  <div class="fb-row">
    <span class="fb-ico" data-icon="search"></span>
    <input id="fq" value="ELIS" aria-label="Find" spellcheck="false">
    <span class="fb-count" id="fcount"></span>
    <button class="ib" data-act="fprev" aria-label="Previous match" data-icon="up"></button>
    <button class="ib" data-act="fnext" aria-label="Next match" data-icon="down"></button>
    <button class="tb on" data-act="fcase" aria-pressed="true" title="Match case">Aa</button>
    <button class="tb on" data-act="fword" aria-pressed="true" title="Whole word">Word</button>
    <button class="ib" data-act="fclose" aria-label="Close find" data-icon="x"></button>
  </div>
  <div class="fb-row">
    <span class="fb-ico" data-icon="swap"></span>
    <input id="fr" value="ELLIS" aria-label="Replace with" spellcheck="false">
    <button class="rb" data-act="frep">Replace</button>
    <button class="rb" data-act="frepall">Replace all</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="proto" role="region" aria-label="Prototype controls">
  <span class="tag">PROTOTYPE</span>
  <button data-p="prev" aria-label="Previous paper tone">&lsaquo;</button>
  <span class="vl" id="vl"></span>
  <button data-p="next" aria-label="Next paper tone">&rsaquo;</button>
  <span class="dv"></span>
  <button data-p="theme" id="p-theme"></button>
  <button data-p="find" id="p-find">Find</button>
  <button data-p="ac" id="p-ac">Autocomplete</button>
  <button data-p="focus" id="p-focus">Focus</button>
  <button data-p="backup" id="p-backup"></button>
  <button data-p="keys" id="p-keys" aria-label="Keys">?</button>
</div>
<div id="keys" hidden>
  <div><b>← →</b>switch dark paper tone</div>
  <div><b>1…7, 0</b>element of the current paragraph (Ctrl+1…7 in the app)</div>
  <div><b>click a paragraph</b>put the cursor there</div>
  <div><b>Ctrl+F</b>find and replace</div>
  <div><b>F8</b>next formatting finding</div>
  <div><b>Ctrl+Shift+F</b>focus mode</div>
  <div><b>Ctrl+= / Ctrl+−</b>zoom</div>
  <div><b>Esc</b>close whatever is open</div>
</div>

<script src="script.js"></script>
<script>
(function () {
'use strict';
const P = window.TirProto;
const $ = (s) => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON = {
  chev: '<path d="M4.5 6.5 8 10l3.5-3.5"/>',
  up: '<path d="M4.5 9.5 8 6l3.5 3.5"/>',
  down: '<path d="M4.5 6.5 8 10l3.5-3.5"/>',
  branch: '<circle cx="4.5" cy="3.5" r="1.4"/><circle cx="4.5" cy="12.5" r="1.4"/><circle cx="11.5" cy="5" r="1.4"/><path d="M4.5 4.9v6.2M11.5 6.4c0 2.6-2.2 3.1-4.2 3.5-1.6.3-2.8 1-2.8 1.2"/>',
  alert: '<path d="M8 2.3 14.2 13H1.8L8 2.3Z"/><path d="M8 6.4v3M8 11.2v.1"/>',
  cloudok: '<path d="M4.6 12.6h6.7a2.9 2.9 0 0 0 .3-5.8 4 4 0 0 0-7.7.9 2.5 2.5 0 0 0 .7 4.9Z"/><path d="m6.4 9.7 1.2 1.2 2.3-2.5"/>',
  cloudoff: '<path d="M4.6 12.6h6.7a2.9 2.9 0 0 0 .3-5.8 4 4 0 0 0-7.7.9 2.5 2.5 0 0 0 .7 4.9Z"/><path d="m2.5 2.5 11 11"/>',
  check: '<path d="m3.5 8.5 3 3 6-7"/>',
  spin: '<path d="M8 2.6a5.4 5.4 0 1 1-5.4 5.4"/>',
  search: '<circle cx="7" cy="7" r="4.3"/><path d="m10.2 10.2 3.3 3.3"/>',
  swap: '<path d="M3 5.5h9l-2.5-2.5M13 10.5H4l2.5 2.5"/>',
  x: '<path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/>',
  plus: '<path d="M8 3.5v9M3.5 8h9"/>',
  minus: '<path d="M3.5 8h9"/>',
};
const svg = (name, size = 15, cls = '') => `<svg class="${cls}" viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

const BACKUP = [
  { kind: 'ok', saved: 'Saved', icon: 'cloudok', short: 'Backed up', long: 'Saved on this machine. Backed up to GitHub 3 minutes ago.' },
  { kind: 'busy', saved: 'Saving…', icon: 'cloudok', short: 'Backed up', long: 'Saving to this machine. Last backed up to GitHub 3 minutes ago.' },
  { kind: 'wait', saved: 'Saved', icon: 'cloudoff', short: 'Offline, 6 waiting', long: 'Saved on this machine. Offline: 6 changes will back up when GitHub is reachable.' },
  { kind: 'warn', saved: 'Saved', icon: 'alert', short: 'Backup paused', long: 'Saved on this machine. Backup paused: GitHub has changes this machine does not, so Tir merged nothing.' },
];
const PAPERS = { night: 'Night', dusk: 'Dusk', lamplight: 'Lamplight' };

const params = new URLSearchParams(location.search);
const els = P.parse(P.SAMPLE);
const S = {
  variant: 'A',
  palette: 'brass',
  paper: PAPERS[params.get('paper')] ? params.get('paper') : 'dusk',
  theme: params.get('theme') === 'light' ? 'light' : 'dark',
  els,
  cur: els.findIndex((e) => e.t === 'dialogue'),
  zoom: 1,
  find: { open: false, q: 'ELIS', r: 'ELLIS', matchCase: true, whole: true, cur: 0, total: 0, hitEls: [] },
  ac: false, focus: false, backup: 0, page: 1,
  project: 'Salt Line',
  drafts: [{ name: 'First Draft', when: 'Sep 2026' }, { name: 'Rewrite, Nov 2026', when: 'today' }],
  active: 1,
  forking: false,
  lay: null,
};

const curType = () => { const e = S.els[S.cur]; return e ? e.t : null; };
const curScene = () => (S.lay ? S.lay.sceneOf[S.cur] : 0);
const pageCount = () => (S.lay ? S.lay.pages.length : 0);
const issues = () => (S.lay ? S.lay.findings.length : 0);
const bk = () => BACKUP[S.backup];

// ---------- variant chrome ----------
const T = {
  A: {
    top() {
      const b = bk();
      return `<div class="a-left">
          <button class="a-proj" title="Projects · Ctrl+O">${S.project}</button>
          <span class="a-slash">/</span>
          <button class="a-draft" data-act="drafts" aria-haspopup="menu">${svg('branch', 14)}<span>${S.drafts[S.active].name}</span>${svg('chev', 14)}</button>
        </div>
        <div class="a-mid" role="toolbar" aria-label="Element">${P.ORDER.map((t) => `<button class="elb${t === curType() ? ' on' : ''}" data-el="${t}" title="${P.LABELS[t]} · Ctrl+${P.KEYS[t]}" aria-pressed="${t === curType()}"><span class="f">${P.LABELS[t]}</span><span class="s">${P.SHORT[t]}</span></button>`).join('')}</div>
        <div class="a-right">
          <span class="pg" id="pgpos">${pgText()}</span>
          <span class="sep"></span>
          <button class="${issues() ? 'warn' : ''}" data-act="issue" title="Formatting findings · F8 next">${svg('alert', 15)}<span>${issues()}</span></button>
          <span class="sep"></span>
          <button data-act="status" title="${b.long}" class="${b.kind === 'warn' ? 'warn' : ''}"><span>${b.saved}</span><span style="opacity:.5">·</span>${svg(b.icon, 16)}<span>${b.short}</span></button>
        </div>`;
    },
    side() {
      const sc = S.lay.scenes;
      return `<div class="a-head"><span>Scenes</span><span>${sc.length}</span></div>
        <ol class="a-scenes">${sc.map((s) => `<li class="${s.n === curScene() ? 'on' : ''}" data-scene="${s.i}" title="${s.heading}"><span class="no">${s.n}</span><span class="hd">${s.heading}</span><span class="pg">${s.page}</span></li>`).join('')}</ol>
        <div class="a-foot"><span>${pageCount()} pages</span><span class="z"><button data-act="zoom-" aria-label="Zoom out">${svg('minus', 14)}</button><span>${Math.round(S.zoom * 100)}%</span><button data-act="zoom+" aria-label="Zoom in">${svg('plus', 14)}</button></span></div>`;
    },
    pg: () => `Page ${S.page} of ${pageCount()}`,
  },
};
const pgText = () => T[S.variant].pg();

// ---------- render ----------
function render() {
  S.lay = P.layout(S.els);
  const r = P.renderPages($('#pages'), S.lay, { cur: S.cur, find: S.find, ac: S.ac, marginLabel: S.variant === 'B' });
  S.find.total = r.hits;
  S.find.hitEls = r.hitEls;
  if (S.find.cur >= r.hits) S.find.cur = Math.max(0, r.hits - 1);
  $('#pages').style.zoom = S.zoom;
  renderChrome();
}
function renderChrome() {
  document.body.dataset.variant = S.variant;
  document.body.dataset.palette = S.palette;
  document.body.dataset.paper = S.paper;
  document.body.dataset.theme = S.theme;
  document.body.classList.toggle('focus', S.focus);
  $('#topbar').innerHTML = T[S.variant].top();
  $('#sidebar').innerHTML = T[S.variant].side();
  $('#fcount').textContent = S.find.total ? `${S.find.cur + 1} of ${S.find.total}` : 'No matches';
  $('#vl').textContent = S.theme === 'dark' ? `Dark paper: ${PAPERS[S.paper]}` : 'Light theme: white paper';
  $('#p-theme').textContent = S.theme === 'dark' ? 'Dark' : 'Light';
  $('#p-find').classList.toggle('on', S.find.open);
  $('#p-ac').classList.toggle('on', S.ac);
  $('#p-focus').classList.toggle('on', S.focus);
  $('#p-backup').textContent = `Backup: ${bk().kind === 'ok' ? 'backed up' : bk().kind === 'busy' ? 'saving' : bk().kind === 'wait' ? 'offline' : 'paused'}`;
}
function setUrl() {
  const q = new URLSearchParams({ paper: S.paper });
  if (S.theme === 'light') q.set('theme', 'light');
  history.replaceState(null, '', `${location.pathname}?${q}`);
}
function updatePage() {
  const canvas = $('#canvas');
  const mid = canvas.getBoundingClientRect().top + canvas.clientHeight * 0.4;
  let page = 1;
  document.querySelectorAll('.sheet').forEach((s) => { if (s.getBoundingClientRect().top <= mid) page = +s.dataset.page; });
  if (page !== S.page) { S.page = page; const el = $('#pgpos'); if (el) el.textContent = pgText(); }
}
function scrollToEl(i) {
  requestAnimationFrame(() => {
    const target = document.querySelector(`.el[data-i="${i}"].cur`) || document.querySelector(`.el[data-i="${i}"]`);
    if (target) target.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
  });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- actions ----------
function setType(t) {
  const el = S.els[S.cur];
  if (!el || el.t === 'dual') return;
  let text = el.text;
  if (el.t === 'paren' && t !== 'paren') text = text.replace(/^\(/, '').replace(/\)$/, '');
  if (t === 'paren' && !/^\(.*\)$/.test(text)) text = `(${text})`;
  if (P.UPPER.has(t)) text = text.toUpperCase();
  el.t = t;
  el.text = text;
  if (t === 'character') el.ext = el.ext || ''; else delete el.ext;
  render();
}
function nextIssue() {
  const f = S.lay.findings;
  if (!f.length) { toast('No formatting findings'); return; }
  const after = f.find((x) => x.i > S.cur) || f[0];
  S.cur = after.i;
  render();
  scrollToEl(S.cur);
}
function openFind(open) {
  S.find.open = open;
  $('#findbar').hidden = !open;
  render();
  if (open) { $('#fq').focus(); $('#fq').select(); if (S.find.total) gotoHit(S.find.cur); }
}
function gotoHit(n) {
  if (!S.find.total) return;
  S.find.cur = (n + S.find.total) % S.find.total;
  render();
  requestAnimationFrame(() => { const h = $('#curhit'); if (h) h.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }); });
}
function replaceIn(el, re, r) {
  if (el.t === 'dual') { for (const c of [el.a, el.b]) { c.name = c.name.replace(re, r); c.text = c.text.replace(re, r); } return; }
  el.text = el.text.replace(re, r);
}
function replaceOne() {
  const i = S.find.hitEls[S.find.cur];
  if (i === undefined) return;
  const re = P.findRegex(S.find);
  replaceIn(S.els[i], new RegExp(re.source, re.flags.replace('g', '')), S.find.r);
  render();
  toast('Replaced 1');
}
function replaceAll() {
  const re = P.findRegex(S.find);
  if (!re) return;
  const n = S.find.total;
  S.els.forEach((el) => replaceIn(el, re, S.find.r));
  render();
  toast(`Replaced ${n} · one Undo reverses it`);
}
function setZoom(z) { S.zoom = Math.min(1.5, Math.max(0.6, Math.round(z * 100) / 100)); render(); if (S.variant === 'B') toast(`Zoom ${Math.round(S.zoom * 100)}%`); }
function setFocus(on) { S.focus = on; renderChrome(); if (on) toast('Focus mode · Ctrl+Shift+F or Esc to leave'); }
function setPaper(p) { S.paper = p; S.theme = 'dark'; closeMenus(); renderChrome(); setUrl(); }
function cycleVariant(d) { const k = Object.keys(PAPERS); setPaper(k[(k.indexOf(S.paper) + d + k.length) % k.length]); }

// ---------- draft menu ----------
function draftMenuHTML() {
  const rows = S.drafts.map((d, n) => `<button class="dm-d" role="menuitemradio" aria-checked="${n === S.active}" data-draft="${n}"><span class="ck">${n === S.active ? svg('check', 14) : ''}</span><span>${d.name}</span><small>${d.when}</small></button>`).join('');
  const fork = S.forking
    ? `<div class="dm-fork"><input id="forkname" value="Rewrite 2, Nov 2026" aria-label="Name for the new draft"><button data-act="forkgo">Fork</button></div><div class="dm-note">Copies "${S.drafts[S.active].name}" as it is now. The original stays unchanged.</div>`
    : `<button class="dm-a" data-act="fork">Fork this draft…<small>copies it as it is now</small></button>`;
  return `<div class="dm-h">Drafts of ${S.project}</div>${rows}<hr>${fork}<button class="dm-a" data-act="noop">Rename…</button><button class="dm-a danger" data-act="noop">Delete…</button>`;
}
function openDrafts(anchor) {
  const m = $('#draftmenu');
  if (!m.hidden) { closeMenus(); return; }
  m.innerHTML = draftMenuHTML();
  const r = anchor.getBoundingClientRect();
  m.style.left = `${Math.max(8, r.left)}px`;
  m.style.top = `${r.bottom + 8}px`;
  m.hidden = false;
}
function closeMenus() { $('#draftmenu').hidden = true; S.forking = false; }

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-el],[data-act],[data-scene],[data-draft],[data-p],.el');
  if (!e.target.closest('#draftmenu') && !e.target.closest('[data-act="drafts"]')) closeMenus();
  if (!t) return;
  if (t.dataset.el) { setType(t.dataset.el); return; }
  if (t.dataset.scene) { S.cur = +t.dataset.scene; render(); scrollToEl(S.cur); return; }
  if (t.dataset.draft) { S.active = +t.dataset.draft; closeMenus(); renderChrome(); toast(`Switched to ${S.drafts[S.active].name}`); return; }
  if (t.dataset.p) {
    const p = t.dataset.p;
    if (p === 'prev') cycleVariant(-1);
    if (p === 'next') cycleVariant(1);
    if (p === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; renderChrome(); setUrl(); }
    if (p === 'find') openFind(!S.find.open);
    if (p === 'ac') { S.ac = !S.ac; if (S.ac) S.cur = S.els.findIndex((x) => x.live); render(); if (S.ac) scrollToEl(S.cur); }
    if (p === 'focus') setFocus(!S.focus);
    if (p === 'backup') { S.backup = (S.backup + 1) % BACKUP.length; renderChrome(); }
    if (p === 'keys') { $('#keys').hidden = !$('#keys').hidden; t.classList.toggle('on', !$('#keys').hidden); }
    return;
  }
  const a = t.dataset.act;
  if (a === 'drafts') { openDrafts(t); return; }
  if (a === 'fork') { S.forking = true; $('#draftmenu').innerHTML = draftMenuHTML(); $('#forkname').focus(); $('#forkname').select(); return; }
  if (a === 'forkgo') { doFork(); return; }
  if (a === 'noop') { closeMenus(); toast('Not in this prototype'); return; }
  if (a === 'issue') { nextIssue(); return; }
  if (a === 'status') { toast(bk().long); return; }
  if (a === 'zoom-') { setZoom(S.zoom - 0.1); return; }
  if (a === 'zoom+') { setZoom(S.zoom + 0.1); return; }
  if (a === 'zoomcycle') { const z = [0.9, 1, 1.1, 1.25]; setZoom(z[(z.indexOf(S.zoom) + 1) % z.length] || 1); return; }
  if (a === 'fnext') { gotoHit(S.find.cur + 1); return; }
  if (a === 'fprev') { gotoHit(S.find.cur - 1); return; }
  if (a === 'fcase') { S.find.matchCase = !S.find.matchCase; t.classList.toggle('on', S.find.matchCase); t.setAttribute('aria-pressed', S.find.matchCase); S.find.cur = 0; render(); return; }
  if (a === 'fword') { S.find.whole = !S.find.whole; t.classList.toggle('on', S.find.whole); t.setAttribute('aria-pressed', S.find.whole); S.find.cur = 0; render(); return; }
  if (a === 'fclose') { openFind(false); return; }
  if (a === 'frep') { replaceOne(); return; }
  if (a === 'frepall') { replaceAll(); return; }
  if (t.classList.contains('el') && !e.target.closest('.mark')) {
    S.cur = +t.dataset.i;
    if (!S.els[S.cur].live) S.ac = false;
    render();
    typingSoon();
  }
});
function doFork() {
  const name = ($('#forkname').value || '').trim() || 'Untitled draft';
  S.drafts.push({ name, when: 'just now' });
  S.active = S.drafts.length - 1;
  closeMenus();
  renderChrome();
  toast(`Forked: now writing in ${name}`);
}

$('#fq').addEventListener('input', (e) => { S.find.q = e.target.value; S.find.cur = 0; render(); });
$('#fr').addEventListener('input', (e) => { S.find.r = e.target.value; });
$('#fq').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); gotoHit(S.find.cur + (e.shiftKey ? -1 : 1)); } });
$('#canvas').addEventListener('scroll', updatePage, { passive: true });

let typingTimer;
function typingSoon() {
  clearTimeout(typingTimer);
  document.body.classList.remove('typing');
  if (S.variant === 'B') typingTimer = setTimeout(() => document.body.classList.add('typing'), 1400);
}
document.addEventListener('mousemove', (e) => { if (document.body.classList.contains('typing') && (e.clientY < 60 || e.clientX < 260)) { document.body.classList.remove('typing'); } });

const KEYMAP = { 1: 'scene', 2: 'action', 3: 'character', 4: 'paren', 5: 'dialogue', 6: 'transition', 7: 'shot', 0: 'general' };
document.addEventListener('keydown', (e) => {
  const typingInField = e.target.matches('input, textarea, [contenteditable]');
  if (e.key === 'Escape') {
    if (!$('#draftmenu').hidden) closeMenus();
    else if (S.find.open) openFind(false);
    else if (S.ac) { S.ac = false; render(); }
    else if (S.focus) setFocus(false);
    return;
  }
  if (e.target.id === 'forkname' && e.key === 'Enter') { e.preventDefault(); doFork(); return; }
  if ((e.altKey || e.ctrlKey) && !e.shiftKey && KEYMAP[e.key]) { e.preventDefault(); setType(KEYMAP[e.key]); typingSoon(); return; }
  if (e.ctrlKey && !e.shiftKey && (e.key === 'f' || e.key === 'h')) { e.preventDefault(); openFind(true); return; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f')) { e.preventDefault(); setFocus(!S.focus); return; }
  if (e.ctrlKey && (e.key === '=' || e.key === '+')) { e.preventDefault(); setZoom(S.zoom + 0.1); return; }
  if (e.ctrlKey && e.key === '-') { e.preventDefault(); setZoom(S.zoom - 0.1); return; }
  if (e.key === 'F8') { e.preventDefault(); nextIssue(); return; }
  if (typingInField) return;
  if (!e.ctrlKey && !e.altKey && !e.metaKey && /^[0-7]$/.test(e.key)) { setType(KEYMAP[e.key]); typingSoon(); return; }
  if (e.key === 'ArrowRight' && !e.altKey && !e.ctrlKey) { cycleVariant(1); return; }
  if (e.key === 'ArrowLeft' && !e.altKey && !e.ctrlKey) { cycleVariant(-1); return; }
});

document.querySelectorAll('[data-icon]').forEach((n) => { n.innerHTML = svg(n.dataset.icon, 15); });
render();
setUrl();
})();
</script>
</body>
</html>
