[tools]
node = "24.22.2"
pnpm = "12.18.0"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[tasks.install]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

# dev and check need the system libraries from flake.nix: run outside the
# Nix shell, each re-runs itself inside it (TIR_DEV_SHELL is set there).
[tasks.dev]
description = "Run Tir with the Vite dev server (enters the Nix shell if needed)"
run = """
[ -n "${TIR_DEV_SHELL:-}" ] || exec nix develop --command mise run dev
pnpm exec tauri dev
"""

[tasks.check]
description = "Lint, format, type checks, tests and Rust checks (enters the Nix shell if needed)"
# One script, so the shell is entered once; errexit stops at the first failure.
run = """
[ -n "${TIR_DEV_SHELL:-}" ] || exec nix develop --command mise run check
pnpm exec biome check .
pnpm exec tsc -p tsconfig.json
pnpm exec tsc -p src/core/tsconfig.json
pnpm exec vitest run
cargo fmt --manifest-path src-tauri/Cargo.toml --check
cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
cargo test --manifest-path src-tauri/Cargo.toml --locked
"""

[tasks.fmt]
description = "Format TypeScript and Rust, and apply Biome's safe fixes (no Nix shell needed)"
run = """
pnpm exec biome check --write .
cargo fmt --manifest-path src-tauri/Cargo.toml
"""

[tasks.parity]
description = "Compare Tir's page breaks with Final Draft PDFs (calibration/ by default)"
run = "node tools/parity/main.ts"

[tasks.pagination-timing]
description = "Measure median pagination time for a feature-length draft"
run = "node tools/pagination-timing.ts"

[tasks.editor-timing]
description = "Time typing in an isolated dev app (see Measuring the editor in docs/architecture.md)"
run = "node tools/editor-timing/main.ts"

[tasks.editor-placement]
description = "Check that the running dev app shows every line where the layout engine puts it"
run = "node tools/editor-placement.ts"
